<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="PC와 갤럭시에서 오프라인으로 사용하는 Pocket Ops 최신 HTML과 망간전송용 ZIP을 받으세요.">
<title>Pocket Ops 다운로드 · 쭈니박스</title>
<style>
  :root {color-scheme:light dark; --bg:#f3f5ef; --card:#fcfdf9; --ink:#172720; --soft:#47594e; --line:#bac7bb; --accent:#20583b; --button:#fff; font-family:system-ui,sans-serif}
  * {box-sizing:border-box}
  body {margin:0; background:var(--bg); color:var(--ink); line-height:1.6; word-break:keep-all; overflow-wrap:anywhere}
  main {max-width:47rem; margin:auto; padding:clamp(1.25rem,5vw,3rem)}
  header,footer {display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.75rem; font-size:.9rem}
  header {border-bottom:1px solid var(--line); padding-bottom:1rem}
  h1 {font-size:clamp(2.8rem,10vw,5rem); letter-spacing:-.07em; line-height:1.08; margin:clamp(2.5rem,8vw,5rem) 0 1rem}
  p {color:var(--soft); margin:0}
  .files {margin:2.2rem 0 1.2rem; border:1px solid var(--line); border-radius:1rem; overflow:hidden; background:var(--card)}
  article {display:flex; align-items:center; justify-content:space-between; gap:1.25rem; padding:1.4rem}
  article + article {border-top:1px solid var(--line)}
  h2 {font-size:1.16rem; margin:0 0 .2rem}
  a {color:var(--accent); text-underline-offset:.2em}
  .button {display:inline-flex; align-items:center; justify-content:center; text-decoration:none; padding:.65rem 1rem; min-height:44px; border:1px solid var(--accent); border-radius:.55rem; font-weight:650; white-space:nowrap}
  .primary {background:var(--accent); color:var(--button)}
  a:focus-visible {outline:3px solid currentColor; outline-offset:3px}
  .primary:focus-visible {outline-color:var(--accent)}
  footer {padding:.4rem .2rem}
  @media(max-width:36rem) {article {align-items:stretch; flex-direction:column; gap:.85rem} .button {width:100%}}
  @media(prefers-color-scheme:dark) {:root {--bg:#14201a; --card:#1d2d23; --ink:#edf3eb; --soft:#b5c5b8; --line:#415b49; --accent:#a1d7ae; --button:#122a19}}
</style>
<main>
  <header><b>쭈니박스</b><a href="https://github.com/seamoon23/pocket-ops/releases/latest">최신 버전 · 변경 내역</a></header>
  <h1>Pocket Ops</h1>
  <p>서버 명령어를 찾아 복사하고 SQL·로그를 정리하는 오프라인 공구함입니다. PC와 갤럭시에서 같은 파일을 사용합니다.</p>
  <section class="files" aria-label="최신 버전 다운로드">
    <article><div><h2>단일 HTML</h2><p>다운로드 폴더에서 브라우저로 열면 바로 사용할 수 있습니다.</p></div><a class="button primary" href="/pocket-ops.html">HTML 받기 ↓</a></article>
    <article><div><h2>망간전송용 ZIP</h2><p>동일한 HTML과 한국어 안내가 들어 있습니다. 압축을 풀고 pocket-ops.html을 여세요.</p></div><a class="button" href="/pocket-ops.zip">ZIP 받기 ↓</a></article>
  </section>
  <footer><a href="/SHA256SUMS.txt">SHA-256 체크섬 받기</a><a href="https://github.com/seamoon23/pocket-ops">GitHub 저장소</a></footer>
</main>
</html>
