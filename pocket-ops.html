 if(id==='settings'){
  let importSeq=0;cleanupTasks.add(()=>{importSeq++;});
  q('#settings-export').onclick=()=>download('pocket-ops-settings.json',JSON.stringify({...state,app:'Pocket Ops',exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');
  q('#settings-import').onchange=async e=>{const seq=++importSeq;try{const f=e.target.files[0];checkFile(f,16*1024*1024);const incoming=validateState(JSON.parse(C.decode(new Uint8Array(await f.arrayBuffer()))));if(seq!==importSeq||!root.isConnected)return;modal('설정을 가져올까요?','<div class="note warn">현재 즐겨찾기·내 명령어·테마를 가져온 설정으로 <b>교체</b>합니다. 로그·변환 입력은 가져오지 않습니다. 가져온 명령어의 안전성은 검증되지 않습니다.</div><p class="muted">도구 '+incoming.toolFavs.length+'개 · 명령어 즐겨찾기 '+incoming.cmdFavs.length+'개 · 내 명령어 '+incoming.customCommands.length+'개</p><button class="btn primary" id="confirm-import">교체하여 가져오기</button>',()=>{$('#confirm-import').onclick=()=>{state=incoming;save();applyTheme();$('#modal').close();views.delete('commands');views.delete('settings');go('settings');toast('설정을 가져왔어요.');};});}catch(e){if(seq===importSeq&&root.isConnected)status('settings-status',e.message,'error');}};
  q('#settings-add-command').onclick=()=>customCommand();q('#clear-inputs').onclick=clearInputs;
  q('#settings-reset').onclick=()=>{if(!confirm('이 앱의 즐겨찾기·내 명령어·테마를 초기화할까요? 다른 사이트 저장소는 건드리지 않습니다.'))return;state={...BASE,toolFavs:[...BASE.toolFavs],cmdFavs:[...BASE.cmdFavs],customCommands:[]};save();applyTheme();views.delete('commands');views.delete('settings');go('settings');toast('앱 설정을 초기화했어요.');};
 }
}
const renderers={home,favorites,commands:commandsPage,encoding:encodingPage,codec:codecPage,json:jsonPage,text:textPage,diff:diffPage,logs:logsPage,sql:sqlPage,unicode:unicodePage,time:timePage,chmod:chmodPage,cron:cronPage,hash:hashPage,regex:regexPage,settings:settingsPage};
function applyTheme(){document.documentElement.dataset.theme=state.theme;const b=$('#theme-toggle');b.innerHTML=icon(state.theme==='dark'?'sun':'moon');b.title=state.theme==='dark'?'밝은 테마로':'어두운 테마로';b.setAttribute('aria-label',b.title);}
function syncStars(){
 $$('[data-tool-star]').forEach(b=>{const active=state.toolFavs.includes(b.dataset.toolStar);b.classList.toggle('starred',active);b.setAttribute('aria-pressed',String(active));});
 $$('[data-cmd-star]').forEach(b=>{const active=state.cmdFavs.includes(b.dataset.cmdStar);b.classList.toggle('starred',active);b.setAttribute('aria-pressed',String(active));});
}
function go(id,updateHash=true){
 if(!Object.prototype.hasOwnProperty.call(renderers,id))id='home';current=id;
 if(['home','favorites','settings'].includes(id))views.delete(id);
 let root=views.get(id),fresh=!root;if(!root){root=document.createElement('section');root.dataset.page=id;root.innerHTML=renderers[id]()+footer();views.set(id,root);}
 $('#view').replaceChildren(root);if(fresh)bindPage(id,root);
 $('#page-crumb').textContent=id==='home'?'내 작업실':id==='favorites'?'즐겨찾기':id==='settings'?'내 포켓 관리':tool(id).title;
 document.title=(id==='home'?'작지만 든든한 내 작업실':$('#page-crumb').textContent)+' · Pocket Ops';
 $$('.nav-btn').forEach(b=>{const active=b.dataset.go===id;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 $('#sidebar').classList.remove('open');$('#mobile-menu').setAttribute('aria-expanded','false');syncStars();counters(root);window.scrollTo(0,0);
 if(updateHash&&location.hash!=='#'+id){try{history.replaceState(null,'','#'+id);}catch(_){location.hash=id;}}
}
function clearInputs(){if(!confirm('열린 모든 도구의 입력·선택한 파일·결과를 비울까요? 즐겨찾기와 저장한 명령어는 유지됩니다.'))return;cleanupTasks.forEach(fn=>fn());cleanupTasks.clear();if($('#modal').open)$('#modal').close();$('#modal').innerHTML='';views.clear();go(current);toast('열린 도구의 입력을 비웠어요. 클립보드와 저장 파일은 그대로입니다.');}
function openPalette(){if($('#modal').open)$('#modal').close();const p=$('#palette');if(!p.open)p.showModal();$('#palette-input').value='';paletteIndex=0;renderPalette();$('#palette-input').focus();}
function renderPalette(){const text=$('#palette-input').value.trim(),ts=D.tools.filter(t=>matches([t.title,t.desc,t.keywords].join(' '),text)).map(t=>({type:'tool',id:t.id,title:t.title,detail:t.desc,icon:t.icon})),cs=allCommands().filter(c=>matches([c.title,c.command,c.tags,c.group].join(' '),text)).map(c=>({type:'command',id:c.id,title:c.title,detail:c.command,icon:'terminal'}));paletteItems=text?ts.concat(cs).slice(0,24):ts.filter(t=>state.toolFavs.includes(t.id)).concat(cs.filter(c=>state.cmdFavs.includes(c.id))).slice(0,12);paletteIndex=0;$('#palette-results').innerHTML=paletteItems.length?paletteItems.map((r,i)=>'<button class="palette-item '+(!i?'selected':'')+'" id="palette-item-'+i+'" role="option" aria-selected="'+(!i)+'" data-palette-index="'+i+'" tabindex="-1">'+icon(r.icon)+'<span><strong>'+E(r.title)+'</strong><small>'+E(r.detail)+'</small></span><span class="tag right">'+(r.type==='tool'?'도구':'명령어')+'</span></button>').join(''):'<div class="empty">다른 단어로 찾아보세요.</div>';$('#palette-input').setAttribute('aria-activedescendant',paletteItems.length?'palette-item-0':'');}
function selectPalette(index){const item=paletteItems[index];if(!item)return;$('#palette').close();if(item.type==='tool')go(item.id);else openCommand(item.id);}
function outputText(id){const el=document.getElementById(id);let text=el.value!==undefined?el.value:el.textContent;if(el.dataset.exactEol==='crlf')text=text.replace(/\r\n?/g,'\n').replace(/\n/g,'\r\n');return text;}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-go],a');if(!b)return;
 if(b.hasAttribute('data-tool-star')){e.stopPropagation();const id=b.dataset.toolStar;state.toolFavs=state.toolFavs.includes(id)?state.toolFavs.filter(x=>x!==id):state.toolFavs.concat(id);save();syncStars();if(current==='favorites')go('favorites');if(current==='home')$('#home-cards').innerHTML=homeCards($('[data-home-domain].active')?.dataset.homeDomain||'');$('[data-tool-star="'+id+'"]')?.focus();return;}
 if(b.hasAttribute('data-cmd-star')){const id=b.dataset.cmdStar;state.cmdFavs=state.cmdFavs.includes(id)?state.cmdFavs.filter(x=>x!==id):state.cmdFavs.concat(id);save();syncStars();if(current==='favorites')go('favorites');if(current==='commands')renderCommands();$('[data-cmd-star="'+id+'"]')?.focus();return;}
 if(b.hasAttribute('data-copy-id')){copy(outputText(b.dataset.copyId));return;}
 if(b.hasAttribute('data-download-id')){download('pocket-'+b.dataset.downloadId+'.txt',outputText(b.dataset.downloadId));return;}
 if(b.hasAttribute('data-clear-id')){const el=document.getElementById(b.dataset.clearId);el.value='';el.dispatchEvent(new Event('input',{bubbles:true}));el.focus();counters();return;}
 if(b.hasAttribute('data-command')){openCommand(b.dataset.command);return;}
 if(b.hasAttribute('data-edit-command')){customCommand(b.dataset.editCommand);return;}
 if(b.hasAttribute('data-command-search')){const search=b.dataset.commandSearch;go('commands');$('#command-query').value=search;$('#command-group').value='';$('#command-permission').value='';$('#command-favorites').checked=false;renderCommands();return;}
 if(b.hasAttribute('data-open-palette')){openPalette();return;}
 if(b.hasAttribute('data-palette-index')){selectPalette(Number(b.dataset.paletteIndex));return;}
 if(b.hasAttribute('data-home-domain')){const domain=b.dataset.homeDomain;$$('[data-home-domain]').forEach(x=>{const active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-pressed',String(active));});$('#home-cards').innerHTML=homeCards(domain);$('#home-domain-guide').innerHTML=domain?'<b>'+E(DOMAINS.find(x=>x[0]===domain)[1])+'</b> 작업에 유용한 도구입니다. <button class="text-btn" data-open-domain="'+domain+'">환경별 명령어 열기 →</button>':'공통 도구로 텍스트·JSON·인코딩을 정리하고, 환경을 선택해 관련 명령어를 찾아보세요.';return;}
 if(b.hasAttribute('data-command-domain')){setCommandDomain(b.dataset.commandDomain);return;}
 if(b.hasAttribute('data-open-domain')){go('commands');$('#command-query').value='';$('#command-permission').value='';$('#command-favorites').checked=false;setCommandDomain(b.dataset.openDomain);return;}
 if(b.hasAttribute('data-go')){const domain=current==='home'&&b.dataset.go==='commands'?$('[data-home-domain].active')?.dataset.homeDomain:'';go(b.dataset.go);if(domain){$('#command-query').value='';$('#command-permission').value='';$('#command-favorites').checked=false;setCommandDomain(domain);}return;}
});
let counterTimer;document.addEventListener('input',e=>{if(e.target.matches('textarea')){clearTimeout(counterTimer);counterTimer=setTimeout(()=>counters(),120);}});
document.addEventListener('keydown',e=>{
 const editable=e.target.matches('input,textarea,select,[contenteditable=true]');
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return;}
 if(e.key==='/'&&!editable&&!$('dialog[open]')){e.preventDefault();openPalette();return;}
 if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('#mobile-menu').setAttribute('aria-expanded','false');}
 if($('#palette').open){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!paletteItems.length)return;paletteIndex=(paletteIndex+(e.key==='ArrowDown'?1:-1)+paletteItems.length)%paletteItems.length;$$('.palette-item').forEach((el,i)=>{el.classList.toggle('selected',i===paletteIndex);el.setAttribute('aria-selected',String(i===paletteIndex));});$('#palette-input').setAttribute('aria-activedescendant','palette-item-'+paletteIndex);$('#palette-item-'+paletteIndex).scrollIntoView({block:'nearest'});}if(e.key==='Enter'){e.preventDefault();selectPalette(paletteIndex);}return;}
 if(!editable&&e.target.classList.contains('tool-card')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click();}
});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==current)go(id,false);});
$('#palette-input').addEventListener('input',renderPalette);
$('#theme-toggle').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';save();applyTheme();};
$('#mobile-menu').onclick=()=>{const open=$('#sidebar').classList.toggle('open');$('#mobile-menu').setAttribute('aria-expanded',String(open));};
$('#clear-all-button').onclick=clearInputs;
$('#release-download').onclick=async()=>{const b=$('#release-download');b.disabled=true;try{if(!window.PocketRelease)throw new Error('배포 파일이 포함되지 않은 빌드입니다.');await window.PocketRelease.download();toast('현재 열린 버전 '+(window.PocketBuild?.version||D.version)+'의 배포 ZIP을 저장합니다.');}catch(e){toast('배포 파일 저장 실패: '+e.message);}finally{b.disabled=false;}};
try{nav();$('#brand-icon').innerHTML=icon('pocket');$('#mobile-menu').innerHTML=icon('menu');$('#top-search-icon').innerHTML=icon('search');$('#clear-all-button').innerHTML=icon('trash');$('#settings-icon').innerHTML=icon('settings');$('#palette-icon').innerHTML=icon('search');applyTheme();refreshStorage();go(location.hash.slice(1)||'home',false);}catch(e){$('#view').innerHTML='<div class="note error">시작하지 못했습니다: '+E(e.message)+'<br>허용된 최신 Chromium 기반 브라우저에서 다시 열어 주세요.</div>';console.error(e);}
})();

</script>
</body>
