</style><main id="offline-reference"><header><p>Pocket Ops · 단일 파일 오프라인 참고</p><h1>읽기 전용 명령어 참고</h1>
<p>이 뷰어에서는 JavaScript가 꺼져 있어 기본 명령어를 읽는 화면을 표시합니다. 인터넷이나 다른 파일은 필요하지 않습니다.</p>
<p>Windows · PowerShell / Linux · Bash / DB별 SQL 예제입니다. 명령어를 실행하지 않습니다. 검색·즐겨찾기·변환·자동 복사·값 검증·배포하기는 사용할 수 없습니다. 텍스트 길게 누르기·선택 복사는 뷰어 지원에 따라 가능합니다.</p>
<p><strong>{{PORT}}, {{PATH}} 같은 표시는 입력 자리입니다. 그대로 실행하거나 단순 치환해 붙여넣지 마세요.</strong> 셸 인용·권한·대상 확인이 필요합니다. 값을 넣어 복사하려면 JavaScript를 지원하는 허용된 브라우저에서 이 파일을 여세요. 부하·변경 명령은 영향과 복구 절차를 먼저 확인하세요.</p>

<section id="reference-windows"><h2>Windows · PowerShell</h2>
<article class="reference-command" id="reference-cmd-088" data-risk="read">
<h3>Windows UTF-8 로그 끝 200줄</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Get-Content -LiteralPath {{FILE}} -Tail 200 -Encoding UTF8</code></pre><p>PowerShell에서 UTF-8 파일을 읽습니다. CP949 등 다른 인코딩은 한글 · 인코딩 진료소에서 먼저 확인하세요.</p>
<p><strong>입력 자리 포함: 자동 치환·검증 없이 그대로 실행하지 마세요.</strong></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-089" data-risk="read">
<h3>Windows UTF-8 로그 실시간 보기</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Get-Content -LiteralPath {{FILE}} -Tail 100 -Encoding UTF8 -Wait</code></pre><p>PowerShell에서 UTF-8 파일을 읽습니다. 종료는 Ctrl+C입니다. 파일 교체 시 Linux tail -F와 같은 재연결을 보장하지 않습니다.</p>
<p><strong>입력 자리 포함: 자동 치환·검증 없이 그대로 실행하지 마세요.</strong></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-090" data-risk="read">
<h3>Windows 리스닝 포트</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Get-NetTCPConnection -State Listen</code></pre><p>PowerShell NetTCPIP 모듈이 필요합니다. OS 버전과 권한에 따라 표시가 제한될 수 있습니다.</p>
<p>대체 명령어: <a href="#reference-cmd-108">Windows 포트 대체 · .NET 조회</a></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-091" data-risk="read">
<h3>Windows 파일 SHA-256</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Get-FileHash -Algorithm SHA256 -LiteralPath {{FILE}}</code></pre><p>망 반입 전·후 파일이 같은지 비교할 때 사용합니다.</p>
<p><strong>입력 자리 포함: 자동 치환·검증 없이 그대로 실행하지 마세요.</strong></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-092" data-risk="read">
<h3>Windows 프로세스 CPU 누적 순</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Get-Process | Sort-Object CPU -Descending | Select-Object -First 10</code></pre><p>CPU 컬럼은 대개 누적 CPU 시간으로 순간 사용률과 다릅니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-093" data-risk="read">
<h3>Windows 지정 포트 TCP 확인</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Test-NetConnection -ComputerName {{HOST}} -Port {{PORT}}</code></pre><p>승인된 내부 대상에 연결을 시도합니다. 네트워크 정책에 따라 오래 걸릴 수 있습니다.</p>
<p><strong>입력 자리 포함: 자동 치환·검증 없이 그대로 실행하지 마세요.</strong></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-103" data-risk="read">
<h3>Windows PowerShell 버전 확인</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>$PSVersionTable</code></pre><p>Windows 시작 메뉴 → Windows PowerShell을 검색해 엽니다. 기본 5.1을 기준으로 하며 PowerShell 7 추가 설치는 필요하지 않습니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-104" data-risk="read">
<h3>Windows OS · 메모리 정보</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Get-CimInstance -ClassName Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture, LastBootUpTime, TotalVisibleMemorySize, FreePhysicalMemory</code></pre><p>메모리 값은 KiB 단위입니다. 현재 로컬 PC만 조회하며 CIM 서비스 정책에 따라 조회가 제한될 수 있습니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-105" data-risk="read">
<h3>Windows 디스크 남은 공간</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Get-PSDrive -PSProvider FileSystem | Select-Object Name, Root, Used, Free</code></pre><p>Used와 Free는 바이트 단위입니다. 현재 PowerShell에서 보이는 드라이브를 조회합니다. 네트워크 드라이브는 상태에 따라 지연될 수 있습니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-106" data-risk="read">
<h3>Windows IP · 게이트웨이 확인</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 NetTCPIP 모듈</p><pre><code>Get-NetIPConfiguration</code></pre><p>로컬 네트워크 설정을 조회합니다. 어댑터가 꺼져 있거나 정책이 제한하면 일부 정보가 나오지 않을 수 있습니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-107" data-risk="read">
<h3>Windows DNS 이름 해석</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 DnsClient 모듈</p><pre><code>Resolve-DnsName -Name {{HOST}}</code></pre><p>승인된 내부 이름만 지정하세요. 시스템의 이름 해석 결과이며 해당 서비스의 접속 성공을 보장하지 않습니다.</p>
<p><strong>입력 자리 포함: 자동 치환·검증 없이 그대로 실행하지 마세요.</strong></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-108" data-risk="read">
<h3>Windows 포트 대체 · .NET 조회</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>[System.Net.NetworkInformation.IPGlobalProperties]::GetIPGlobalProperties().GetActiveTcpListeners() | Select-Object Address, Port</code></pre><p>NetTCPIP 명령이 없을 때 기존 .NET으로 로컬 수신 주소와 포트를 봅니다. PID는 제공하지 않습니다. 제한 언어 모드에서는 메서드 호출이 차단될 수 있습니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-109" data-risk="read">
<h3>Windows 특정 PID 확인</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Get-Process -Id {{PID}} | Select-Object Id, ProcessName, CPU, StartTime, Path</code></pre><p>PID가 재사용될 수 있으므로 이름도 확인하세요. 다른 계정·보호 프로세스는 경로와 시작 시각을 읽지 못할 수 있습니다.</p>
<p><strong>입력 자리 포함: 자동 치환·검증 없이 그대로 실행하지 마세요.</strong></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-110" data-risk="read">
<h3>Windows 서비스 목록 조회</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Get-Service | Sort-Object Status, DisplayName | Select-Object Status, Name, DisplayName</code></pre><p>로컬 서비스의 상태와 이름만 확인합니다. 서비스 시작·중지·시작 유형 변경을 하지 않습니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-111" data-risk="read">
<h3>Windows 최근 오류 · 경고 50개</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 권한·환경 제한 확인</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Get-WinEvent -FilterHashtable @{LogName=&#x27;Application&#x27;; Level=2,3} -MaxEvents 50 | Select-Object TimeCreated, Id, LevelDisplayName, ProviderName, Message</code></pre><p>Application 로그의 오류·경고만 읽습니다. 일치 이벤트가 없으면 오류 메시지가 나올 수 있습니다. 메시지에 계정·경로가 포함될 수 있어 반출 전 확인하세요.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-112" data-risk="read">
<h3>Windows UTF-8 로그 문자열 검색</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Select-String -LiteralPath {{FILE}} -Pattern {{PATTERN}} -SimpleMatch -Encoding UTF8 -Context 3,3</code></pre><p>UTF-8 파일에서 문자열을 검색하고 앞뒤 3줄을 표시합니다. CP949 파일은 한글 · 인코딩 진료소에서 원본 인코딩을 먼저 확인하세요.</p>
<p><strong>입력 자리 포함: 자동 치환·검증 없이 그대로 실행하지 마세요.</strong></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-113" data-risk="read">
<h3>Windows 바로 아래 파일 목록</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Get-ChildItem -LiteralPath {{DIR}} -File | Select-Object Name, Length, LastWriteTime</code></pre><p>지정 폴더의 파일만 조회합니다. 하위 폴더를 재귀 탐색하지 않아 범위가 과도하게 넓어지지 않습니다. Length는 바이트입니다.</p>
<p><strong>입력 자리 포함: 자동 치환·검증 없이 그대로 실행하지 마세요.</strong></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-114" data-risk="read">
<h3>Windows 경로 ACL 조회</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Get-Acl -LiteralPath {{PATH}} | Format-List Path, Owner, AccessToString</code></pre><p>권한을 변경하지 않습니다. 파일 시스템 ACL을 보여주며 공유 권한·중첩 그룹을 포함한 최종 유효 권한 계산은 아닙니다.</p>
<p><strong>입력 자리 포함: 자동 치환·검증 없이 그대로 실행하지 마세요.</strong></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-115" data-risk="read">
<h3>Windows 명령어 경로 확인</h3><p>Windows · powershell</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Windows 11 · 기본 Windows PowerShell 5.1 이상</p><pre><code>Get-Command -Name {{BIN}} -ErrorAction SilentlyContinue | Select-Object Name, CommandType, Source, Definition</code></pre><p>현재 세션에서 찾을 수 있는 명령을 보여줍니다. 빈 결과는 설치 부재의 증거가 아닙니다. 와일드카드 이름은 여러 항목을 표시할 수 있습니다.</p>
<p><strong>입력 자리 포함: 자동 치환·검증 없이 그대로 실행하지 마세요.</strong></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
</section>
<section id="reference-linux"><h2>Linux · Bash</h2>
<article class="reference-command" id="reference-cmd-001" data-risk="read">
<h3>배포판과 버전 확인</h3><p>기본 점검 · bash</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Ubuntu 22.04 / RHEL 7 대상 · 설치된 도구와 계정 권한 확인</p><pre><code>cat /etc/os-release</code></pre><p>RHEL·Ubuntu 등 배포판 정보를 확인합니다. 아주 오래된 배포판은 파일이 없을 수 있습니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-002" data-risk="read">
<h3>커널 · CPU 아키텍처 확인</h3><p>기본 점검 · bash</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Ubuntu 22.04 / RHEL 7 대상 · 설치된 도구와 계정 권한 확인</p><pre><code>uname -a</code></pre><p>커널 버전과 x86_64 등 아키텍처를 확인합니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-003" data-risk="read">
<h3>내 계정 · 그룹 · 권한 확인</h3><p>기본 점검 · bash</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Ubuntu 22.04 / RHEL 7 대상 · 설치된 도구와 계정 권한 확인</p><pre><code>id</code></pre><p>root 없이 현재 UID, GID, 보조 그룹을 확인합니다. Docker 그룹도 확인할 수 있습니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-004" data-risk="read">
<h3>서버 이름과 현재 시간</h3><p>기본 점검 · bash</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Ubuntu 22.04 / RHEL 7 대상 · 설치된 도구와 계정 권한 확인</p><pre><code>hostname
date &#x27;+%Y-%m-%d %H:%M:%S %Z&#x27;</code></pre><p>서버 시간대와 시간을 함께 확인합니다. 스케줄과 로그 시간을 비교할 때 유용합니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-005" data-risk="read">
<h3>문자셋 · 로케일 확인</h3><p>기본 점검 · bash</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Ubuntu 22.04 / RHEL 7 대상 · 설치된 도구와 계정 권한 확인</p><pre><code>locale</code></pre><p>LANG, LC_CTYPE 등을 확인합니다. 설정 조회만 하며 문자셋을 변경하지 않습니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-006" data-risk="read">
<h3>명령어 경로 · 셸 정의 확인</h3><p>기본 점검 · bash</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Ubuntu 22.04 / RHEL 7 대상 · 설치된 도구와 계정 권한 확인</p><pre><code>command -v -- {{BIN}}</code></pre><p>현재 셸에서 실행할 경로·별칭·함수를 확인합니다. 결과가 없어도 PATH 밖 설치 여부는 알 수 없습니다.</p>
<p><strong>입력 자리 포함: 자동 치환·검증 없이 그대로 실행하지 마세요.</strong></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-007" data-risk="read">
<h3>현재 디렉터리와 숨김 파일</h3><p>기본 점검 · bash</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Ubuntu 22.04 / RHEL 7 대상 · 설치된 도구와 계정 권한 확인</p><pre><code>pwd
ls -lah</code></pre><p>현재 위치와 숨김 파일을 확인합니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-008" data-risk="read">
<h3>내 계정의 crontab 조회</h3><p>기본 점검 · bash</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: 기존 crontab 도구 · Cronie 또는 cron 패키지</p><pre><code>crontab -l</code></pre><p>조회만 합니다. 다른 계정이나 시스템 전체의 예약 작업은 이 결과만으로 알 수 없습니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-009" data-risk="read">
<h3>가동 시간 · 서버 부하 확인</h3><p>자원 · 프로세스 · bash</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Ubuntu 22.04 / RHEL 7 대상 · 설치된 도구와 계정 권한 확인</p><pre><code>uptime</code></pre><p>load average와 가동 시간을 확인합니다. CPU 사용률 자체를 뜻하지는 않습니다.</p>
<p>대체 명령어: <a href="#reference-cmd-095">uptime 대체 · 커널 부하 정보</a></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-010" data-risk="read">
<h3>메모리 · 스왑 사용량</h3><p>자원 · 프로세스 · bash</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Ubuntu 22.04 / RHEL 7 대상 · 설치된 도구와 계정 권한 확인</p><pre><code>free -m</code></pre><p>MiB 기준 메모리와 swap을 확인합니다. 배포판 버전에 따라 컬럼 구성이 다릅니다.</p>
<p>대체 명령어: <a href="#reference-cmd-094">free 대체 · 커널 메모리 정보</a></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-011" data-risk="read">
<h3>CPU · 메모리 · I/O 연속 확인</h3><p>자원 · 프로세스 · bash</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Ubuntu 22.04 / RHEL 7 대상 · 설치된 도구와 계정 권한 확인</p><pre><code>vmstat 1 5</code></pre><p>1초 간격 5회 조회합니다. 첫 행은 부팅 이후 평균일 수 있습니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-012" data-risk="read">
<h3>내 프로세스 CPU 순으로 보기</h3><p>자원 · 프로세스 · bash</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Ubuntu 22.04 / RHEL 7 대상 · 설치된 도구와 계정 권한 확인</p><pre><code>ps -u &quot;$(id -un)&quot; -o pid,ppid,%cpu,%mem,etime,args --sort=-%cpu</code></pre><p>현재 계정만 조회합니다. 실행 인수에 민감정보가 포함될 수 있어 반출 시 주의하세요.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-013" data-risk="read">
<h3>프로세스 이름으로 PID 찾기</h3><p>자원 · 프로세스 · bash</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Ubuntu 22.04 / RHEL 7 대상 · 설치된 도구와 계정 권한 확인</p><pre><code>pgrep -af -- {{PATTERN}}</code></pre><p>패턴은 정규식입니다. 전체 명령행에 비밀번호나 토큰이 보일 수 있습니다.</p>
<p><strong>입력 자리 포함: 자동 치환·검증 없이 그대로 실행하지 마세요.</strong></p>
<p>대체 명령어: <a href="#reference-cmd-096">pgrep 대체 · ps와 문자열 검색</a></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-014" data-risk="read">
<h3>특정 PID 상태와 가동 시간</h3><p>자원 · 프로세스 · bash</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: Ubuntu 22.04 / RHEL 7 대상 · 설치된 도구와 계정 권한 확인</p><pre><code>ps -p {{PID}} -o pid,ppid,user,%cpu,%mem,etime,args</code></pre><p>PID가 재사용될 수 있으므로 대상 이름과 계정을 함께 확인합니다.</p>
<p><strong>입력 자리 포함: 자동 치환·검증 없이 그대로 실행하지 마세요.</strong></p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-015" data-risk="read">

FROM dual;</code></pre><p>기존 Oracle SQL 도구의 쿼리 창에서 실행하세요. 접속 세션과 기본 스키마를 읽습니다. PDB 구분이 필요한 환경은 별도로 확인하세요. Bash나 PowerShell 명령이 아닙니다.</p>

<article class="reference-command" id="reference-cmd-127" data-risk="read">
<h3>CSQL 테이블 구조 확인</h3><p>CUBRID · CSQL · csql</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: SSH 셸 → CSQL 연결 → csql&gt; 에 한 줄 입력</p><pre><code>;schema pocket_ops_sample</code></pre><p>예시 이름을 확인할 테이블명으로 바꿔 입력하세요. 컬럼, 타입, 제약 조건을 보고 SQL에 사용할 키를 확인합니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-128" data-risk="read">
<h3>CSQL 자동 커밋 상태 확인</h3><p>CUBRID · CSQL · csql</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: SSH 셸 → CSQL 연결 → csql&gt; 에 한 줄 입력</p><pre><code>;autocommit</code></pre><p>현재 설정을 표시합니다. ON이면 실행한 변경이 즉시 확정될 수 있습니다. 변경 작업은 새 수동 커밋 세션에서 시작하세요.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-129" data-risk="change">
<h3>CSQL 트랜잭션 확정</h3><p>CUBRID · CSQL · csql</p>
<p class="reference-risk">실제 변경 · 실행 전 확인 · 일반 계정 범위</p>
<p>조건: SSH 셸 → CSQL 연결 → csql&gt; 에 한 줄 입력</p><pre><code>;commit</code></pre><p>현재 트랜잭션의 미확정 변경 전체를 저장합니다. 영향 행 수와 결과를 확인한 후 선택하세요. 확정 뒤에는 ;rollback으로 되돌릴 수 없습니다.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-130" data-risk="change">
<h3>CSQL 트랜잭션 취소</h3><p>CUBRID · CSQL · csql</p>
<p class="reference-risk">실제 변경 · 실행 전 확인 · 일반 계정 범위</p>
<p>조건: SSH 셸 → CSQL 연결 → csql&gt; 에 한 줄 입력</p><pre><code>;rollback</code></pre><p>현재 트랜잭션의 미확정 변경 전체를 취소합니다. 같은 세션의 다른 작업까지 포함되므로 범위를 확인하세요.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-131" data-risk="change">
<h3>CSQL 종료</h3><p>CUBRID · CSQL · csql</p>
<p class="reference-risk">실제 변경 · 실행 전 확인 · 일반 계정 범위</p>
<p>조건: SSH 셸 → CSQL 연결 → csql&gt; 에 한 줄 입력</p><pre><code>;exit</code></pre><p>미확정 작업을 먼저 확정하거나 취소한 뒤 종료합니다. 종료 시 나타나는 질문은 읽고 응답하세요.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-132" data-risk="read">
<h3>SELECT · 키로 대상 행 확인</h3><p>CUBRID · CSQL · sql</p>
<p class="reference-risk">조회 중심 · 일반 계정 범위</p>
<p>조건: CUBRID 접속 → csql&gt; 또는 CUBRID SQL 편집기 · 예시 테이블 pocket_ops_sample의 이름·컬럼을 확인</p><pre><code>SELECT item_id, item_name
FROM pocket_ops_sample
WHERE item_id = 1001;</code></pre><p>item_id가 기본 키인 가상 테이블 예시입니다. 실제 키와 조건에 맞게 수정해 조회하고, 변경 전 대상 행과 현재 값을 확인하세요.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-133" data-risk="change">
<h3>INSERT · 한 행 추가</h3><p>CUBRID · CSQL · sql</p>
<p class="reference-risk">실제 변경 · 실행 전 확인 · 권한·환경 제한 확인</p>
<p>조건: CUBRID 접속 → csql&gt; 또는 CUBRID SQL 편집기 · 예시 테이블 pocket_ops_sample의 이름·컬럼을 확인 · 변경 권한과 현재 세션의 자동 커밋 OFF 확인</p><pre><code>-- INSERT INTO pocket_ops_sample (item_id, item_name)
-- VALUES (1001, &#x27;SAMPLE&#x27;);</code></pre><p>대상 키가 비어 있는지, 컬럼 타입과 필수 값이 맞는지 확인하세요. 편집기에서 예시 이름·값을 바꾼 뒤 각 줄의 -- 를 지우고 한 문장만 실행하세요. 반영 전 영향 행 수를 확인하세요.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-134" data-risk="change">
<h3>UPDATE · 키와 기존 값으로 수정</h3><p>CUBRID · CSQL · sql</p>
<p class="reference-risk">실제 변경 · 실행 전 확인 · 권한·환경 제한 확인</p>
<p>조건: CUBRID 접속 → csql&gt; 또는 CUBRID SQL 편집기 · 예시 테이블 pocket_ops_sample의 이름·컬럼을 확인 · 변경 권한과 현재 세션의 자동 커밋 OFF 확인</p><pre><code>-- UPDATE pocket_ops_sample
-- SET item_name = &#x27;UPDATED&#x27;
-- WHERE item_id = 1001 AND item_name = &#x27;SAMPLE&#x27;;</code></pre><p>같은 WHERE 조건을 SELECT로 먼저 조회하고 변경할 행 수와 기존 값을 확인하세요. 편집기에서 예시 이름·값을 바꾼 뒤 각 줄의 -- 를 지우고 한 문장만 실행하세요. 반영 전 영향 행 수를 확인하세요.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>
<article class="reference-command" id="reference-cmd-135" data-risk="change">
<h3>DELETE · 키와 기존 값으로 삭제</h3><p>CUBRID · CSQL · sql</p>
<p class="reference-risk">실제 변경 · 실행 전 확인 · 권한·환경 제한 확인</p>
<p>조건: CUBRID 접속 → csql&gt; 또는 CUBRID SQL 편집기 · 예시 테이블 pocket_ops_sample의 이름·컬럼을 확인 · 변경 권한과 현재 세션의 자동 커밋 OFF 확인</p><pre><code>-- DELETE FROM pocket_ops_sample
-- WHERE item_id = 1001 AND item_name = &#x27;SAMPLE&#x27;;</code></pre><p>같은 WHERE 조건을 SELECT로 먼저 조회하고 삭제할 행 수와 복구 방법을 확인하세요. 편집기에서 예시 이름·값을 바꾼 뒤 각 줄의 -- 를 지우고 한 문장만 실행하세요. 반영 전 영향 행 수를 확인하세요.</p>
<a href="#offline-reference">분류로 돌아가기</a></article>

function domainButtons(kind,active='',common=false){return '<div class="domain-tabs" role="group" aria-label="'+(kind==='home'?'추천 도구':'명령어')+' 환경 선택">'+DOMAINS.map(([id,label])=>'<button class="chip '+(id===active?'active':'')+'" data-'+kind+'-domain="'+id+'" aria-pressed="'+(id===active)+'">'+(!id&&common?'공통 · 전체':label)+'</button>').join('')+'</div>';}
function homeCards(domain=''){return D.tools.filter(t=>!domain||toolDomains[domain].includes(t.id)).sort((a,b)=>Number(state.toolFavs.includes(b.id))-Number(state.toolFavs.includes(a.id))).map(card).join('');}
function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3100);}
function setStatus(id,message,type=''){const el=document.getElementById(id);if(el){el.className='status '+type;el.textContent=message;}}
function run(id,fn){try{const result=fn();setStatus(id,'완료','success');return result;}catch(e){setStatus(id,e.message,'error');return undefined;}}
function download(name,content,type='text/plain;charset=utf-8'){
 try{const blob=content instanceof Blob?content:new Blob([C.utf8(content)],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}catch(e){toast('파일 저장 실패: '+e.message);}
}
function modal(title,html,bind){setMenu(false);const d=$('#modal');if(d.open)d.close();d.innerHTML='<div class="dialog-head"><h2>'+E(title)+'</h2><button class="icon-btn" data-close aria-label="닫기">'+icon('x')+'</button></div><div class="dialog-body">'+html+'</div>';d.querySelector('[data-close]').onclick=()=>d.close();d.showModal();if(bind)bind(d);}
let copySequence = 0;
async function copy(text){
 const request = ++copySequence;
 if(typeof text!=='string')return;
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);if(request!==copySequence)return;toast('클립보드에 복사했어요.');return;}}catch(_){}
 if(request!==copySequence)return;
 const area=document.createElement('textarea');area.value=text;area.setAttribute('aria-label','복사용 텍스트');area.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:.01;';const active=document.activeElement;($('dialog[open]')||document.body).append(area);area.focus();area.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}area.remove();if(active&&active.isConnected)active.focus();
 if(ok){toast('클립보드에 복사했어요.');return;}
 modal('직접 복사해 주세요','<p class="muted">자동 복사가 제한되어 있습니다. PC에서는 선택된 내용을 Ctrl+C로 복사하세요. 휴대폰에서는 텍스트 길게 누르기 → 모두 선택 → 복사를 이용하세요.</p><textarea id="manual-copy" readonly class="short" aria-label="수동 복사할 내용"></textarea>',()=>{const a=$('#manual-copy');a.value=text;a.focus();a.select();});
}
function checkFile(file,max=8*1024*1024){if(!file)throw new Error('파일을 선택하세요.');if(file.size>max)throw new Error('파일은 '+(max/1024/1024)+' MiB 이하로 나누어 주세요.');}
function editor(id,label,placeholder='',readonly=false,height=''){return '<div class="panel"><div class="panel-head"><h2>'+label+'</h2><div class="actions">'+(readonly?'<button class="btn small" data-copy-id="'+id+'">'+icon('copy')+'복사</button><button class="icon-btn" data-download-id="'+id+'" title="UTF-8 텍스트 저장" aria-label="결과 파일 저장">'+icon('download')+'</button>':'<button class="btn small subtle" data-clear-id="'+id+'">비우기</button>')+'</div></div><textarea id="'+id+'" class="'+height+'" '+(readonly?'readonly ':'')+'spellcheck="false" autocomplete="off" maxlength="2000000" aria-label="'+label+'" placeholder="'+E(placeholder)+'"></textarea><div class="editor-meta"><span data-counter-for="'+id+'">0자 · 0줄</span><span>'+(readonly?'UTF-8로 저장':'현재 탭 메모리에만 유지')+'</span></div></div>';}
function field(id,label,value='',type='text'){return '<label class="field"><span>'+E(label)+'</span><input id="'+id+'" type="'+type+'" value="'+E(String(value))+'" autocomplete="off" spellcheck="false"></label>';}
function select(id,label,options){return '<label class="field"><span>'+label+'</span><select id="'+id+'">'+options.map(([v,t])=>'<option value="'+E(v)+'">'+E(t)+'</option>').join('')+'</select></label>';}

function footer(){return '<footer class="footer"><span>'+icon('shield')+'이 페이지는 입력을 외부로 전송하지 않습니다.</span><span>POCKET OPS '+(window.PocketBuild?.version||D.version)+' · OFFLINE FIELD KIT</span></footer>';}

 let html='<button class="nav-btn active" data-go="home">'+icon('home')+'내 작업실</button><button class="nav-btn" data-go="favorites">'+icon('star')+'즐겨찾기</button>';

function card(t){return '<article class="tool-card" data-go="'+t.id+'" tabindex="0" role="link" aria-label="'+E(t.title)+' 열기"><div class="card-top"><div class="tool-icon '+t.color+'">'+icon(t.icon)+'</div><button class="icon-btn card-star '+(state.toolFavs.includes(t.id)?'starred':'')+'" data-tool-star="'+t.id+'" title="즐겨찾기" aria-label="'+E(t.title)+' 즐겨찾기" aria-pressed="'+state.toolFavs.includes(t.id)+'">'+icon('star')+'</button></div><h3>'+E(t.title)+'</h3><p>'+E(t.desc)+'</p><div class="card-footer"><span class="tag">'+t.tag+'</span>'+icon('arrow')+'</div></article>';}
function home(){return '<div class="page-title"><div><div class="eyebrow">OFFLINE FIELD KIT</div><h1>작업 전에, 내 작업실</h1><p>PC와 휴대폰에서 파일 하나로 여는 오프라인 도구와 서버 명령어 참고집.</p></div><span class="offline-pill">'+icon('shield')+'로컬 처리</span></div>'+
 '<section class="start-guide"><div><h2>찾고 → 확인하고 → 복사하세요</h2><p>실행 조건에서 입력 위치를 확인하세요. 셸 명령은 SSH·PowerShell에서, CSQL 세션 명령과 SQL은 해당 DB 클라이언트에서 사용합니다.</p><div class="actions"><button class="btn primary" data-go="commands">'+icon('terminal')+'명령어 포켓 열기</button><button class="btn" data-go="favorites">'+icon('star')+'즐겨찾기</button><button class="text-btn" data-open-palette>빠른 검색 <kbd>Ctrl K</kbd></button></div></div><div class="start-facts"><strong>'+D.tools.length+'개 도구 · '+D.commands.length+'개 명령어</strong><span>설치 없이 · 네트워크 요청 없이</span><span>입력과 파일은 현재 탭 메모리에만</span></div></section>'+
 '<div class="section-head"><h2>환경별 추천 도구</h2><span class="muted small">즐겨찾는 도구가 먼저 표시됩니다.</span></div>'+domainButtons('home','',true)+'<div id="home-domain-guide" class="note compact">공통 도구로 텍스트·JSON·인코딩을 정리하고, 환경을 선택해 관련 명령어를 찾아보세요.</div><div id="home-cards" class="tool-grid section-gap">'+homeCards()+'</div><div class="note compact section-gap">'+icon('lock')+' 메뉴에서 도구 선택 → 샘플 또는 입력 → 실행 → 결과의 복사 / 저장. 명령어를 자동 실행하거나 서버에 접속하지 않습니다.</div>';}
function commandCard(c){const risk={read:['green','조회 중심'],load:['orange','부하 주의'],change:['red','실제 변경'],custom:['orange','사용자 명령']}[c.risk]||['orange','확인 필요'];return '<article class="command-card"><div class="command-top"><span class="tag '+risk[0]+'">'+risk[1]+'</span><h3>'+E(c.title)+'</h3><button class="icon-btn card-star '+(state.cmdFavs.includes(c.id)?'starred':'')+'" data-cmd-star="'+c.id+'" title="명령어 즐겨찾기" aria-label="명령어 즐겨찾기" aria-pressed="'+state.cmdFavs.includes(c.id)+'">'+icon('star')+'</button></div><pre>'+E(c.command)+'</pre><p>'+E(c.note)+'</p><div class="actions"><div class="chip-row"><span class="tag">'+E(c.group)+'</span><span class="tag '+(c.permission==='limited'?'orange':'')+'">'+(c.permission==='limited'?'권한 확인':'일반 계정')+'</span></div><button class="btn small" data-command="'+c.id+'">'+icon(/\{\{[A-Z_]+\}\}/.test(c.command)?'edit':'copy')+(/\{\{[A-Z_]+\}\}/.test(c.command)?'값 넣기 · 복사':'확인 · 복사')+'</button></div></article>';}
function commandsPage(){return pageHead('commands')+domainButtons('command')+'<div class="command-controls"><input id="command-query" placeholder="상황이나 명령어 검색 · 포트, 로그, 한글, JEUS…" aria-label="명령어 검색"><select id="command-group" aria-label="명령어 분류"><option value="">모든 분류</option>'+[...new Set(allCommands().map(c=>c.group))].map(s=>'<option>'+E(s)+'</option>').join('')+'</select><select id="command-permission" aria-label="권한 필터"><option value="">모든 권한</option><option value="user">일반 계정 중심</option><option value="limited">권한 확인 필요</option></select></div><div class="actions spread"><div class="chip-row">'+['포트','로그','권한','JEUS','Tomcat','한글'].map(x=>'<button class="chip" data-command-search="'+x+'">'+x+'</button>').join('')+'</div><button class="btn small" id="add-command">'+icon('plus')+'내 명령어 추가</button></div><div class="note compact" id="command-domain-guide">환경 선택 → 분류 / 검색 → 확인 · 복사. 각 명령의 실행 조건과 대체 명령을 함께 확인하세요. 조회 결과가 없다고 미설치로 판단하지 마세요.</div><div class="section-head"><h2>필요한 명령어 <span class="count" id="command-count"></span></h2>'+check('command-favorites','즐겨찾기만')+'</div><div class="command-list" id="command-list"></div>';
}
function matches(text,query){return query.trim().toLowerCase().split(/\s+/).filter(Boolean).every(w=>text.toLowerCase().includes(w));}
function renderCommands(){if(!$('#command-list'))return;const q=$('#command-query').value,group=$('#command-group').value,perm=$('#command-permission').value,fav=$('#command-favorites').checked,domain=$('[data-command-domain].active')?.dataset.commandDomain||'';const results=allCommands().filter(c=>(!domain||commandDomain(c)===domain)&&(!group||c.group===group)&&(!perm||c.permission===perm)&&(!fav||state.cmdFavs.includes(c.id))&&matches([c.title,c.group,c.command,c.note,c.tags,c.prerequisite].join(' '),q)).sort((a,b)=>Number(state.cmdFavs.includes(b.id))-Number(state.cmdFavs.includes(a.id)));$('#command-count').textContent=results.length+' / '+allCommands().length;$('#command-list').innerHTML=results.length?results.map(commandCard).join(''):'<div class="empty">'+icon('search')+'<p>일치하는 명령어가 없어요. 다른 단어나 분류를 사용해 보세요.</p></div>';}

 const guide=$('#command-domain-guide');

 if(domain==='db'){

function openCommand(id){const c=cmd(id);if(!c)return;const fields=c.risk==='custom'?[]:[...new Set(Array.from(c.command.matchAll(/\{\{([A-Z_]+)\}\}/g),m=>m[1]))];let caution=c.risk==='change'?'변경 작업에 사용하는 명령입니다. 대상과 영향 범위를 먼저 확인하세요.':c.risk==='load'?'조회 중에도 CPU·메모리·디스크 부하 또는 JVM 일시 지연이 발생할 수 있습니다.':c.risk==='custom'?'사용자가 저장하거나 가져온 명령입니다. 안전성을 검증하지 않았습니다. 내용을 확인하세요.':'실행 전 서버·계정·설치 경로를 확인하세요. 이 페이지는 복사만 합니다.';
 const alternatives=(c.alternatives||[]).map(cmd).filter(Boolean);
 modal(c.title,(c.prerequisite?'<div class="note"><b>실행 조건</b> '+E(c.prerequisite)+'</div>':'')+'<p class="muted">'+E(c.note)+'</p><div class="note '+(c.risk!=='read'?'warn':'')+'">'+caution+'</div><div class="form-grid two">'+fields.map(n=>{const p=D.params[n]||{label:n,default:''};const val=c.shell==='powershell'?(p.defaultPowerShell??p.default):p.default;return field('param-'+n,p.label,val);}).join('')+'</div><div class="panel-head"><span class="field-label">'+({powershell:'PowerShell',sql:'DB SQL 편집기 · SQL',csql:'csql> · CSQL 세션 명령',bash:'Linux 셸 · Bash'}[c.shell])+' · 최종 명령어</span><span class="tag">자동 실행 안 함</span></div><textarea id="command-preview" readonly class="short" spellcheck="false" aria-label="생성된 명령어"></textarea><div id="command-status" class="status"></div>'+(c.risk!=='read'?'<div class="actions" style="margin:12px 0">'+check('command-ack','대상과 명령 내용을 확인했습니다.')+'</div>':'')+(alternatives.length?'<div class="alternative-commands"><span class="field-label">사용할 수 없을 때 · 조건을 비교하고 하나씩 선택</span><div class="actions">'+alternatives.map(a=>'<button class="btn small" data-command="'+a.id+'">'+E(a.title)+'</button>').join('')+'</div></div>':'')+'<div class="actions spread"><div>'+(c.risk==='custom'?'<button class="btn small" id="edit-command">'+icon('edit')+'수정</button>':'')+'</div><button class="btn primary" id="copy-command">'+icon('copy')+'명령어 복사</button></div>',()=>{
  function preview(){try{const vals={};fields.forEach(n=>vals[n]=$('#param-'+n).value);$('#command-preview').value=fields.length?C.fillCommand(c.command,vals,D.params,c.shell):c.command;setStatus('command-status',fields.length?'입력한 셸 인수를 인용했습니다. 대상과 최종 명령을 확인하세요.':'표시된 원문을 복사합니다.');$('#copy-command').disabled=c.risk!=='read'&&!$('#command-ack').checked;}catch(e){$('#command-preview').value='';setStatus('command-status',e.message,'error');$('#copy-command').disabled=true;}}
  fields.forEach(n=>$('#param-'+n).addEventListener('input',()=>{if($('#command-ack'))$('#command-ack').checked=false;preview();}));if($('#command-ack'))$('#command-ack').onchange=preview;$('#copy-command').onclick=()=>copy($('#command-preview').value);if($('#edit-command'))$('#edit-command').onclick=()=>customCommand(c.id);preview();
 });
}
function customCommand(id){const existing=id?cmd(id):null;
 modal(existing?'내 명령어 수정':'내 명령어 추가','<div class="note warn">명령어 본문은 브라우저에 평문 저장되며 백업에도 포함됩니다. 비밀번호·토큰·내부 개인정보는 넣지 마세요. 저장만 하며 실행하지 않습니다.</div>'+field('custom-title','짧은 제목',existing?existing.title:'')+select('custom-shell','실행 환경',[['bash','Bash / Linux'],['powershell','PowerShell']])+'<label class="field"><span>명령어 · 자동 치환하지 않는 원문</span><textarea id="custom-body" class="short" maxlength="8000" spellcheck="false"></textarea></label>'+field('custom-note','설명 / 주의사항',existing?existing.note:'')+field('custom-tags','검색 태그',existing?existing.tags:'')+'<div id="custom-status" class="status"></div><div class="actions spread">'+(existing?'<button class="btn danger" id="custom-delete">삭제</button>':'<span></span>')+'<button class="btn primary" id="custom-save">'+icon('check')+'내 명령어 저장</button></div>',()=>{
  $('#custom-title').maxLength=80;$('#custom-note').maxLength=400;$('#custom-tags').maxLength=200;if(existing){$('#custom-body').value=existing.command;$('#custom-shell').value=existing.shell;}
  $('#custom-save').onclick=()=>run('custom-status',()=>{const title=$('#custom-title').value.trim(),body=$('#custom-body').value;if(!title||!body.trim())throw new Error('제목과 명령어를 입력하세요.');const item={id:existing?existing.id:'custom-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),title,command:body,note:$('#custom-note').value,group:'내 명령어',tags:$('#custom-tags').value,risk:'custom',permission:'limited',shell:$('#custom-shell').value};const next={...state,customCommands:state.customCommands.filter(c=>c.id!==item.id).concat(item)};state=validateState(next);save();$('#modal').close();views.delete('commands');views.delete('settings');go('commands');toast(canStore?'내 명령어를 저장했어요.':'현재 탭에 추가했어요. 설정 백업이 필요합니다.');});
  if(existing)$('#custom-delete').onclick=()=>{if(!confirm('이 명령어를 내 보관함에서 삭제할까요?'))return;state.customCommands=state.customCommands.filter(c=>c.id!==id);state.cmdFavs=state.cmdFavs.filter(x=>x!==id);save();$('#modal').close();views.delete('commands');go('commands');toast('내 명령어를 삭제했어요.');};

function regexJob(pattern, flags, text, signal) {
 C.limit(text, 200_000);
 C.limit(pattern, 2000);
 if (!/^[gimsu]*$/.test(flags) || new Set(flags).size !== flags.length) throw new Error('플래그는 중복 없이 g, i, m, s, u만 사용하세요.');
 if (!window.Worker) throw new Error('이 브라우저는 Worker를 지원하지 않아 정규식을 실행하지 않습니다.');
 function workerMain() {
  self.onmessage = ({data: {pattern, flags, text}}) => {
   try {
    const regex = new RegExp(pattern, flags);
    const rows = [];
    let match, reason = '', length = 4; // Opening and closing brackets and newlines.
    while ((match = regex.exec(text)) !== null) {
     const groups = match.groups || null;
     // Reject an oversized row before allocating escaped copies of repeated captures.
     const rawLength = match.reduce((sum, v) => sum + (v || '').length, 0) +
       Object.values(groups || {}).reduce((sum, v) => sum + (v || '').length, 0);
     if (length + rawLength > 500_000) { reason = 'output'; break; }
     const row = JSON.stringify({index: match.index, match: match[0], captures: match.slice(1), groups});
     length += row.length + (rows.length ? 2 : 0);
     if (length > 500_000) { reason = 'output'; break; }
     rows.push(row);
     if (!regex.global) break;
     if (rows.length === 1000) { reason = 'matches'; break; }
     if (!match[0]) regex.lastIndex += regex.unicode && text.codePointAt(regex.lastIndex) > 0xffff ? 2 : 1;
    }
    self.postMessage({output: rows.length ? '[\n' + rows.join(',\n') + '\n]' : '[]', count: rows.length, reason});
   } catch (error) { self.postMessage({error: error.message}); }
  };
 }
 return new Promise((resolve, reject) => {
  let worker, url, timer;
  function finish(error, result) {
   clearTimeout(timer);
   signal.removeEventListener('abort', cancel);
   if (worker) worker.terminate();
   if (url) URL.revokeObjectURL(url);
   if (error) reject(error); else resolve(result);
  }
  const cancel = () => finish(new Error('작업을 중단했습니다.'));
  try {
   url = URL.createObjectURL(new Blob(['(' + workerMain.toString() + ')()'], {type: 'text/javascript'}));
   worker = new Worker(url);
   signal.addEventListener('abort', cancel, {once: true});
   timer = setTimeout(() => finish(new Error('약 1.2초 제한을 초과하여 정규식을 중단했습니다. 패턴이나 입력을 단순하게 바꿔 보세요.')), 1200);
   worker.onmessage = ({data}) => finish(data.error ? new Error(data.error) : null, data);
   worker.onerror = () => finish(new Error('Worker 실행이 차단되었습니다. 브라우저의 보안 정책을 확인하세요.'));
   worker.postMessage({pattern, flags, text});
  } catch (error) { finish(new Error('안전한 별도 실행 환경을 만들 수 없어 중단했습니다: ' + error.message)); }
 });
}

function setEditorValue(element,text){

}
function editorValue(element){

}

  async function calculate(isFile){const seq=++sequence;set('hash-output','');status('hash-compare','');status('hash-status','로컬에서 계산 중…');try{const algorithm=value('hash-algorithm');let bytes,label;if(isFile){const f=q('#hash-file').files[0];checkFile(f,32*1024*1024);bytes=new Uint8Array(await f.arrayBuffer());if(seq!==sequence)return;label=f.name;}else{bytes=C.utf8(C.limit(value('hash-input')));label='UTF-8 텍스트';}const hash=await C.digest(bytes,algorithm);if(seq!==sequence)return;lastAlgorithm=algorithm;set('hash-output',hash);status('hash-status',algorithm+' · '+label+' · '+bytes.length.toLocaleString()+' bytes','success');comparison();}catch(e){if(seq!==sequence)return;set('hash-output','');status('hash-status',e.message,'error');}}

  act('hash-text','hash-status',()=>calculate(false));act('hash-file-run','hash-status',()=>calculate(true));q('#hash-expected').oninput=comparison;q('#hash-input').oninput=()=>{sequence++;set('hash-output','');status('hash-compare','');status('hash-status','입력이 바뀌었습니다. 다시 계산하세요.');};q('#hash-file').onchange=()=>{sequence++;set('hash-output','');status('hash-compare','');status('hash-status','선택한 파일을 다시 계산하세요.');const f=q('#hash-file').files[0];q('#hash-file-info').textContent=f?f.name+' · '+f.size.toLocaleString()+' bytes':'파일을 선택하세요.';};q('#hash-algorithm').onchange=()=>{sequence++;set('hash-output','');status('hash-status','알고리즘이 바뀌었습니다. 다시 계산하세요.');status('hash-compare','');};
 }
 if(id==='regex'){
  let seq=0, controller;const invalidate=()=>{seq++;controller?.abort();set('regex-output','');status('regex-status','입력이 바뀌었습니다. 다시 테스트하세요.');};cleanupTasks.add(invalidate);
  ['regex-input','regex-pattern','regex-flags'].forEach(name=>q('#'+name).addEventListener('input',invalidate));
  q('#regex-run').onclick=async()=>{const thisSeq=++seq;controller?.abort();controller=new AbortController();set('regex-output','');status('regex-status','분리된 Worker에서 테스트 중…');try{const r=await regexJob(value('regex-pattern'),value('regex-flags'),value('regex-input'),controller.signal);if(thisSeq!==seq)return;set('regex-output',r.output);status('regex-status',r.count+'개 매치'+(r.reason?(r.reason==='output'?' · 캡처 포함 결과 500,000자 상한에서 중단 (나머지는 미검사)':' · 1,000개 상한에서 중단 (나머지는 미검사)'):'')+' · 인덱스는 UTF-16 코드 유닛 기준','success');counters(root);}catch(e){if(thisSeq!==seq)return;set('regex-output','');status('regex-status',e.message,'error');}};
  q('#regex-sample').onclick=()=>{invalidate();set('regex-input','ERROR connection timeout\nINFO ready\nWARN pool almost full');set('regex-pattern','(ERROR|WARN)\\s+(.+)');set('regex-flags','gm');counters(root);};
 }
 if(id==='settings'){
  let importSeq=0;
  q('#settings-export').onclick=()=>download('pocket-ops-settings.json',JSON.stringify({...state,app:'Pocket Ops',exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');
  q('#settings-import').onchange=async e=>{const seq=++importSeq;try{const f=e.target.files[0];checkFile(f,16*1024*1024);const incoming=validateState(JSON.parse(C.decode(new Uint8Array(await f.arrayBuffer()))));if(seq!==importSeq||!root.isConnected)return;modal('설정을 가져올까요?','<div class="note warn">현재 즐겨찾기·내 명령어·테마를 가져온 설정으로 <b>교체</b>합니다. 로그·변환 입력은 가져오지 않습니다. 가져온 명령어의 안전성은 검증되지 않습니다.</div><p class="muted">도구 '+incoming.toolFavs.length+'개 · 명령어 즐겨찾기 '+incoming.cmdFavs.length+'개 · 내 명령어 '+incoming.customCommands.length+'개</p><button class="btn primary" id="confirm-import">교체하여 가져오기</button>',()=>{$('#confirm-import').onclick=()=>{state=incoming;save();applyTheme();$('#modal').close();views.delete('commands');views.delete('settings');go('settings');toast('설정을 가져왔어요.');};});}catch(e){if(seq===importSeq&&root.isConnected)status('settings-status',e.message,'error');}};
  q('#settings-add-command').onclick=()=>customCommand();q('#clear-inputs').onclick=clearInputs;
  q('#settings-reset').onclick=()=>{if(!confirm('이 앱의 즐겨찾기·내 명령어·테마를 초기화할까요? 다른 사이트 저장소는 건드리지 않습니다.'))return;state={...BASE,toolFavs:[...BASE.toolFavs],cmdFavs:[...BASE.cmdFavs],customCommands:[]};save();applyTheme();views.delete('commands');views.delete('settings');go('settings');toast('앱 설정을 초기화했어요.');};
 }
}
const renderers={home,favorites,commands:commandsPage,encoding:encodingPage,codec:codecPage,json:jsonPage,text:textPage,diff:diffPage,logs:logsPage,sql:sqlPage,sqlformat:sqlFormatPage,unicode:unicodePage,time:timePage,chmod:chmodPage,cron:cronPage,hash:hashPage,regex:regexPage,settings:settingsPage};
function applyTheme(){document.documentElement.dataset.theme=state.theme;const b=$('#theme-toggle');b.innerHTML=icon(state.theme==='dark'?'sun':'moon');b.title=state.theme==='dark'?'밝은 테마로':'어두운 테마로';b.setAttribute('aria-label',b.title);}
function syncStars(){
 $$('[data-tool-star]').forEach(b=>{const active=state.toolFavs.includes(b.dataset.toolStar);b.classList.toggle('starred',active);b.setAttribute('aria-pressed',String(active));});
 $$('[data-cmd-star]').forEach(b=>{const active=state.cmdFavs.includes(b.dataset.cmdStar);b.classList.toggle('starred',active);b.setAttribute('aria-pressed',String(active));});
}
function go(id,updateHash=true){
 if(!Object.prototype.hasOwnProperty.call(renderers,id))id='home';current=id;
 if(['home','favorites','settings'].includes(id))views.delete(id);
 let root=views.get(id),fresh=!root;if(!root){root=document.createElement('section');root.dataset.page=id;root.innerHTML=renderers[id]()+footer();views.set(id,root);}
 $('#view').replaceChildren(root);if(fresh)bindPage(id,root);else if(id==='commands')renderCommands();
 $('#page-crumb').textContent=id==='home'?'내 작업실':id==='favorites'?'즐겨찾기':id==='settings'?'내 포켓 관리':tool(id).title;
 document.title=(id==='home'?'작지만 든든한 내 작업실':$('#page-crumb').textContent)+' · Pocket Ops';
 $$('.nav-btn').forEach(b=>{const active=b.dataset.go===id;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 setMenu(false);syncStars();counters(root);window.scrollTo(0,0);
 if(updateHash&&location.hash!=='#'+id){try{history.replaceState(null,'','#'+id);}catch(_){location.hash=id;}}
}
function clearInputs(){if(!confirm('열린 모든 도구의 입력·선택한 파일·결과를 비울까요? 즐겨찾기와 저장한 명령어는 유지됩니다.'))return;
 copySequence++;
 if($('#palette').open)$('#palette').close();
 $('#palette-input').value='';
 $('#palette-input').removeAttribute('aria-activedescendant');
 $('#palette-results').replaceChildren();
 paletteItems=[];paletteIndex=0;
 cleanupTasks.forEach(fn=>fn());cleanupTasks.clear();if($('#modal').open)$('#modal').close();$('#modal').innerHTML='';views.clear();go(current);toast('열린 도구의 입력을 비웠어요. 클립보드와 저장 파일은 그대로입니다.');}
function openPalette(){setMenu(false);if($('#modal').open)$('#modal').close();const p=$('#palette');if(!p.open)p.showModal();$('#palette-input').value='';paletteIndex=0;renderPalette();$('#palette-input').focus();}
function renderPalette(){const text=$('#palette-input').value.trim(),ts=D.tools.filter(t=>matches([t.title,t.desc,t.keywords].join(' '),text)).map(t=>({type:'tool',id:t.id,title:t.title,detail:t.desc,icon:t.icon})),cs=allCommands().filter(c=>matches([c.title,c.command,c.tags,c.group].join(' '),text)).map(c=>({type:'command',id:c.id,title:c.title,detail:c.command,icon:'terminal'}));paletteItems=text?ts.concat(cs).slice(0,24):ts.filter(t=>state.toolFavs.includes(t.id)).concat(cs.filter(c=>state.cmdFavs.includes(c.id))).slice(0,12);paletteIndex=0;$('#palette-results').innerHTML=paletteItems.length?paletteItems.map((r,i)=>'<button class="palette-item '+(!i?'selected':'')+'" id="palette-item-'+i+'" role="option" aria-selected="'+(!i)+'" data-palette-index="'+i+'" tabindex="-1">'+icon(r.icon)+'<span><strong>'+E(r.title)+'</strong><small>'+E(r.detail)+'</small></span><span class="tag right">'+(r.type==='tool'?'도구':'명령어')+'</span></button>').join(''):'<div class="empty">다른 단어로 찾아보세요.</div>';$('#palette-input').setAttribute('aria-activedescendant',paletteItems.length?'palette-item-0':'');}
function selectPalette(index){const item=paletteItems[index];if(!item)return;$('#palette').close();if(item.type==='tool')go(item.id);else openCommand(item.id);}
function outputText(id){const el=document.getElementById(id);return el.value!==undefined?editorValue(el):el.textContent;}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-go],a');if(!b)return;
 if(b.hasAttribute('data-tool-star')){e.stopPropagation();const id=b.dataset.toolStar;state.toolFavs=state.toolFavs.includes(id)?state.toolFavs.filter(x=>x!==id):state.toolFavs.concat(id);save();syncStars();if(current==='favorites')go('favorites');if(current==='home')$('#home-cards').innerHTML=homeCards($('[data-home-domain].active')?.dataset.homeDomain||'');$('[data-tool-star="'+id+'"]')?.focus();return;}
 if(b.hasAttribute('data-cmd-star')){const id=b.dataset.cmdStar;state.cmdFavs=state.cmdFavs.includes(id)?state.cmdFavs.filter(x=>x!==id):state.cmdFavs.concat(id);save();syncStars();if(current==='favorites')go('favorites');if(current==='commands')renderCommands();$('[data-cmd-star="'+id+'"]')?.focus();return;}
 if ((b.dataset.copyId || b.dataset.downloadId) === 'sqlformat-output' && !outputText('sqlformat-output')) {
  toast('SQL 원문을 입력하고 쿼리 정렬을 먼저 눌러 주세요.');
  return;
 }
 if(b.hasAttribute('data-copy-id')){copy(outputText(b.dataset.copyId));return;}
 if (b.hasAttribute('data-download-id')) {
  const id = b.dataset.downloadId;
  const filename = id === 'sqlformat-output' ? 'pocket-query.sql' : 'pocket-' + id + '.txt';
  download(filename, outputText(id));
  return;
 }
 if(b.hasAttribute('data-clear-id')){const el=document.getElementById(b.dataset.clearId);el.value='';el.dispatchEvent(new Event('input',{bubbles:true}));el.focus();counters();return;}
 if(b.hasAttribute('data-command')){openCommand(b.dataset.command);return;}
 if(b.hasAttribute('data-edit-command')){customCommand(b.dataset.editCommand);return;}
 if(b.hasAttribute('data-command-search')){const search=b.dataset.commandSearch;go('commands');$('#command-query').value=search;$('#command-group').value='';$('#command-permission').value='';$('#command-favorites').checked=false;renderCommands();return;}
 if(b.hasAttribute('data-open-palette')){openPalette();return;}
 if(b.hasAttribute('data-palette-index')){selectPalette(Number(b.dataset.paletteIndex));return;}
 if(b.hasAttribute('data-home-domain')){const domain=b.dataset.homeDomain;$$('[data-home-domain]').forEach(x=>{const active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-pressed',String(active));});$('#home-cards').innerHTML=homeCards(domain);$('#home-domain-guide').innerHTML=domain?'<b>'+E(DOMAINS.find(x=>x[0]===domain)[1])+'</b> 작업에 유용한 도구입니다. <button class="text-btn" data-open-domain="'+domain+'">환경별 명령어 열기 →</button>':'공통 도구로 텍스트·JSON·인코딩을 정리하고, 환경을 선택해 관련 명령어를 찾아보세요.';return;}
 if(b.hasAttribute('data-command-domain')){setCommandDomain(b.dataset.commandDomain);return;}
 if(b.hasAttribute('data-open-domain')){go('commands');$('#command-query').value='';$('#command-permission').value='';$('#command-favorites').checked=false;setCommandDomain(b.dataset.openDomain);return;}
 if(b.hasAttribute('data-go')){const domain=current==='home'&&b.dataset.go==='commands'?$('[data-home-domain].active')?.dataset.homeDomain:'';go(b.dataset.go);if(domain){$('#command-query').value='';$('#command-permission').value='';$('#command-favorites').checked=false;setCommandDomain(domain);}return;}
});
let counterTimer;document.addEventListener('input',e=>{if(e.target.matches('textarea')){clearTimeout(counterTimer);counterTimer=setTimeout(()=>counters(),120);}});
document.addEventListener('keydown',e=>{
 const editable=e.target.matches('input,textarea,select,[contenteditable=true]');
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return;}
 if(e.key==='/'&&!editable&&!$('dialog[open]')){e.preventDefault();openPalette();return;}
 if(e.key==='Escape')setMenu(false);
 if(e.key==='Tab'&&$('#sidebar').classList.contains('open')){const buttons=Array.from($('#sidebar').querySelectorAll('button:not(:disabled)')),first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&e.target===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&e.target===last){e.preventDefault();first.focus();}}
 if($('#palette').open){if(e.target!==$('#palette-input'))return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!paletteItems.length)return;paletteIndex=(paletteIndex+(e.key==='ArrowDown'?1:-1)+paletteItems.length)%paletteItems.length;$$('.palette-item').forEach((el,i)=>{el.classList.toggle('selected',i===paletteIndex);el.setAttribute('aria-selected',String(i===paletteIndex));});$('#palette-input').setAttribute('aria-activedescendant','palette-item-'+paletteIndex);$('#palette-item-'+paletteIndex).scrollIntoView({block:'nearest'});}if(e.key==='Enter'){e.preventDefault();selectPalette(paletteIndex);}return;}
 if(!editable&&e.target.classList.contains('tool-card')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click();}
});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==current)go(id,false);});
$('#palette-input').addEventListener('input',renderPalette);
$('#palette-close').onclick=()=>$('#palette').close();
$('#theme-toggle').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';save();applyTheme();};
$('#mobile-menu').onclick=()=>setMenu(true);
$('#mobile-close').onclick=()=>setMenu(false);
$('#menu-scrim').onclick=()=>setMenu(false);
mobileLayout.addEventListener('change',()=>setMenu(false));
$('#clear-all-button').onclick=clearInputs;
$('#release-download').onclick=async()=>{const b=$('#release-download');b.disabled=true;try{if(!window.PocketRelease)throw new Error('배포 파일이 포함되지 않은 빌드입니다.');await window.PocketRelease.download();toast('현재 열린 버전 '+(window.PocketBuild?.version||D.version)+'의 배포 ZIP을 저장합니다.');}catch(e){toast('배포 파일 저장 실패: '+e.message);}finally{b.disabled=false;}};
try{nav();$('#brand-icon').innerHTML=icon('pocket');$('#mobile-menu').innerHTML=icon('menu');$('#top-search-icon').innerHTML=icon('search');$('#clear-all-button').innerHTML=icon('trash');$('#settings-icon').innerHTML=icon('settings');$('#palette-icon').innerHTML=icon('search');applyTheme();refreshStorage();go(location.hash.slice(1)||'home',false);}catch(e){$('#view').innerHTML='<div class="note error">시작하지 못했습니다: '+E(e.message)+'<br>허용된 최신 Chromium 기반 브라우저에서 다시 열어 주세요.</div>';console.error(e);}
})();
