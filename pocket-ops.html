function run(id,fn){try{const result=fn();setStatus(id,'완료','success');return result;}catch(e){setStatus(id,e.message,'error');return undefined;}}
function download(name,content,type='text/plain;charset=utf-8'){
 try{const blob=content instanceof Blob?content:new Blob([C.utf8(content)],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}catch(e){toast('파일 저장 실패: '+e.message);}
}
function modal(title,html,bind){const d=$('#modal');if(d.open)d.close();d.innerHTML='<div class="dialog-head"><h2>'+E(title)+'</h2><button class="icon-btn" data-close aria-label="닫기">'+icon('x')+'</button></div><div class="dialog-body">'+html+'</div>';d.querySelector('[data-close]').onclick=()=>d.close();d.showModal();if(bind)bind(d);}
async function copy(text){
 if(typeof text!=='string')return;
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast('클립보드에 복사했어요.');return;}}catch(_){}
 const area=document.createElement('textarea');area.value=text;area.setAttribute('aria-label','복사용 텍스트');area.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:.01;';const active=document.activeElement;($('dialog[open]')||document.body).append(area);area.focus();area.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}area.remove();if(active&&active.isConnected)active.focus();
 if(ok){toast('클립보드에 복사했어요.');return;}
 modal('직접 복사해 주세요','<p class="muted">이 브라우저의 자동 복사 권한이 제한되어 있습니다. 선택된 내용을 Ctrl+C로 복사하세요.</p><textarea id="manual-copy" readonly class="short" aria-label="수동 복사할 내용"></textarea>',()=>{const a=$('#manual-copy');a.value=text;a.focus();a.select();});
}
function checkFile(file,max=8*1024*1024){if(!file)throw new Error('파일을 선택하세요.');if(file.size>max)throw new Error('파일은 '+(max/1024/1024)+' MiB 이하로 나누어 주세요.');}
function editor(id,label,placeholder='',readonly=false,height=''){return '<div class="panel"><div class="panel-head"><h2>'+label+'</h2><div class="actions">'+(readonly?'<button class="btn small" data-copy-id="'+id+'">'+icon('copy')+'복사</button><button class="icon-btn" data-download-id="'+id+'" title="UTF-8 텍스트 저장" aria-label="결과 파일 저장">'+icon('download')+'</button>':'<button class="btn small subtle" data-clear-id="'+id+'">비우기</button>')+'</div></div><textarea id="'+id+'" class="'+height+'" '+(readonly?'readonly ':'')+'spellcheck="false" autocomplete="off" maxlength="2000000" aria-label="'+label+'" placeholder="'+E(placeholder)+'"></textarea><div class="editor-meta"><span data-counter-for="'+id+'">0자 · 0줄</span><span>'+(readonly?'UTF-8로 저장':'현재 탭 메모리에만 유지')+'</span></div></div>';}
function field(id,label,value='',type='text'){return '<label class="field"><span>'+E(label)+'</span><input id="'+id+'" type="'+type+'" value="'+E(String(value))+'" autocomplete="off" spellcheck="false"></label>';}
function select(id,label,options){return '<label class="field"><span>'+label+'</span><select id="'+id+'">'+options.map(([v,t])=>'<option value="'+E(v)+'">'+E(t)+'</option>').join('')+'</select></label>';}
function check(id,label,checked=false){return '<label class="check"><input type="checkbox" id="'+id+'" '+(checked?'checked':'')+'>'+label+'</label>';}
function counters(root=document){root.querySelectorAll('[data-counter-for]').forEach(el=>{const t=document.getElementById(el.dataset.counterFor);if(t){const s=t.value;el.textContent=Array.from(s).length.toLocaleString()+'자 · '+C.lines(s).length.toLocaleString()+'줄';}});}
function pageHead(id){const t=tool(id);return '<div class="page-title"><div><div class="eyebrow">'+E(t.group.toUpperCase())+' / '+t.id.toUpperCase()+'</div><h1>'+E(t.title)+'</h1><p>'+E(t.desc)+'</p></div><div class="actions"><button class="icon-btn '+(state.toolFavs.includes(id)?'starred':'')+'" data-tool-star="'+id+'" aria-label="도구 즐겨찾기" title="도구 즐겨찾기">'+icon('star')+'</button><span class="offline-pill">'+icon('shield')+'LOCAL ONLY</span></div></div>';}
function footer(){return '<footer class="footer"><span>'+icon('shield')+'이 페이지는 입력을 외부로 전송하지 않습니다.</span><span>POCKET OPS '+(window.PocketBuild?.version||D.version)+' · OFFLINE FIELD KIT</span></footer>';}
function nav(){
 let html='<button class="nav-btn active" data-go="home">'+icon('home')+'내 작업실</button><button class="nav-btn" data-go="favorites">'+icon('star')+'즐겨찾기</button>';
 for(const group of ['서버 운영','변환 도구','데이터 작업']){html+='<div class="nav-label">'+group+'</div>';for(const t of D.tools.filter(t=>t.group===group))html+='<button class="nav-btn" data-go="'+t.id+'">'+icon(t.icon)+t.title+'</button>';}

function home(){return '<div class="page-title"><div><div class="eyebrow">OFFLINE FIELD KIT</div><h1>작업 전에, 내 작업실</h1><p>Windows 11 작업 PC에서 쓰는 오프라인 도구와 서버 명령어 참고집.</p></div><span class="offline-pill">'+icon('shield')+'로컬 처리</span></div>'+
 '<section class="start-guide"><div><h2>찾고 → 확인하고 → 복사하세요</h2><p>명령어는 대상 서버·권한·설치 조건을 확인한 뒤 SSH 터미널 또는 PowerShell에 직접 붙여넣으세요.</p><div class="actions"><button class="btn primary" data-go="commands">'+icon('terminal')+'명령어 포켓 열기</button><button class="btn" data-go="favorites">'+icon('star')+'즐겨찾기</button><button class="text-btn" data-open-palette>빠른 검색 <kbd>Ctrl K</kbd></button></div></div><div class="start-facts"><strong>'+D.tools.length+'개 도구 · '+D.commands.length+'개 명령어</strong><span>설치 없이 · 네트워크 요청 없이</span><span>입력과 파일은 현재 탭 메모리에만</span></div></section>'+
 '<div class="section-head"><h2>환경별 추천 도구</h2><span class="muted small">즐겨찾는 도구가 먼저 표시됩니다.</span></div>'+domainButtons('home','',true)+'<div id="home-domain-guide" class="note compact">공통 도구로 텍스트·JSON·인코딩을 정리하고, 환경을 선택해 관련 명령어를 찾아보세요.</div><div id="home-cards" class="tool-grid section-gap">'+homeCards()+'</div><div class="note compact section-gap">'+icon('lock')+' 메뉴에서 도구 선택 → 샘플 또는 입력 → 실행 → 결과의 복사 / 저장. 명령어를 자동 실행하거나 서버에 접속하지 않습니다.</div>';}
function commandCard(c){const risk={read:['green','조회 중심'],load:['orange','부하 주의'],change:['red','실제 변경'],custom:['orange','사용자 명령']}[c.risk]||['orange','확인 필요'];return '<article class="command-card"><div class="command-top"><span class="tag '+risk[0]+'">'+risk[1]+'</span><h3>'+E(c.title)+'</h3><button class="icon-btn card-star '+(state.cmdFavs.includes(c.id)?'starred':'')+'" data-cmd-star="'+c.id+'" title="명령어 즐겨찾기" aria-label="명령어 즐겨찾기" aria-pressed="'+state.cmdFavs.includes(c.id)+'">'+icon('star')+'</button></div><pre>'+E(c.command)+'</pre><p>'+E(c.note)+'</p><div class="actions"><div class="chip-row"><span class="tag">'+E(c.group)+'</span><span class="tag '+(c.permission==='limited'?'orange':'')+'">'+(c.permission==='limited'?'권한 확인':'일반 계정')+'</span></div><button class="btn small" data-command="'+c.id+'">'+icon(/\{\{[A-Z_]+\}\}/.test(c.command)?'edit':'copy')+(/\{\{[A-Z_]+\}\}/.test(c.command)?'값 넣기 · 복사':'확인 · 복사')+'</button></div></article>';}

}
function matches(text,query){return query.trim().toLowerCase().split(/\s+/).filter(Boolean).every(w=>text.toLowerCase().includes(w));}
function renderCommands(){if(!$('#command-list'))return;const q=$('#command-query').value,group=$('#command-group').value,perm=$('#command-permission').value,fav=$('#command-favorites').checked,domain=$('[data-command-domain].active')?.dataset.commandDomain||'';const results=allCommands().filter(c=>(!domain||commandDomain(c)===domain)&&(!group||c.group===group)&&(!perm||c.permission===perm)&&(!fav||state.cmdFavs.includes(c.id))&&matches([c.title,c.group,c.command,c.note,c.tags,c.prerequisite].join(' '),q)).sort((a,b)=>Number(state.cmdFavs.includes(b.id))-Number(state.cmdFavs.includes(a.id)));$('#command-count').textContent=results.length+' / '+allCommands().length;$('#command-list').innerHTML=results.length?results.map(commandCard).join(''):'<div class="empty">'+icon('search')+'<p>일치하는 명령어가 없어요. 다른 단어나 분류를 사용해 보세요.</p></div>';}

 $$('[data-command-domain]').forEach(b=>{const active=b.dataset.commandDomain===domain;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
 $('#command-group').innerHTML='<option value="">모든 분류</option>'+[...new Set(allCommands().filter(c=>!domain||commandDomain(c)===domain).map(c=>c.group))].map(s=>'<option>'+E(s)+'</option>').join('');
 $('#command-domain-guide').textContent=({windows:'Windows 11: 시작 → Windows PowerShell → 열기. 명령에 권한 확인이 표시된 경우 승인된 계정 권한을 확인하세요.',linux:'Ubuntu 22 / RHEL 7: 승인된 SSH 도구 → 대상 서버 접속 → 셸에서 실행. 패키지·서비스 이름과 설치 조건은 명령마다 확인하세요.',db:'이미 승인된 DB 클라이언트 → 대상 DB 연결 → SQL 편집기. DB 종류·버전과 조회 권한을 확인하고 명령을 하나씩 실행하세요.'})[domain]||'환경 선택 → 분류 / 검색 → 확인 · 복사. 각 명령의 실행 조건과 대체 명령을 함께 확인하세요. 조회 결과가 없다고 미설치로 판단하지 마세요.';renderCommands();

function openCommand(id){const c=cmd(id);if(!c)return;const fields=c.risk==='custom'?[]:[...new Set(Array.from(c.command.matchAll(/\{\{([A-Z_]+)\}\}/g),m=>m[1]))];let caution=c.risk==='change'?'실제 서버 상태나 권한이 변경됩니다. 대상과 영향 범위를 먼저 확인하세요.':c.risk==='load'?'조회 중에도 CPU·메모리·디스크 부하 또는 JVM 일시 지연이 발생할 수 있습니다.':c.risk==='custom'?'사용자가 저장하거나 가져온 명령입니다. 안전성을 검증하지 않았습니다. 내용을 확인하세요.':'실행 전 서버·계정·설치 경로를 확인하세요. 이 페이지는 복사만 합니다.';
 const alternatives=(c.alternatives||[]).map(cmd).filter(Boolean);
 modal(c.title,(c.prerequisite?'<div class="note"><b>실행 조건</b> '+E(c.prerequisite)+'</div>':'')+'<p class="muted">'+E(c.note)+'</p><div class="note '+(c.risk!=='read'?'warn':'')+'">'+caution+'</div><div class="form-grid two">'+fields.map(n=>{const p=D.params[n]||{label:n,default:''};const val=c.shell==='powershell'?(p.defaultPowerShell??p.default):p.default;return field('param-'+n,p.label,val);}).join('')+'</div><div class="panel-head"><span class="field-label">'+(c.shell==='powershell'?'PowerShell':c.shell==='sql'?'DB 조회 창 · SQL':'Bash / GNU Linux')+' · 최종 명령어</span><span class="tag">자동 실행 안 함</span></div><textarea id="command-preview" readonly class="short" spellcheck="false" aria-label="생성된 명령어"></textarea><div id="command-status" class="status"></div>'+(c.risk!=='read'?'<div class="actions" style="margin:12px 0">'+check('command-ack','대상과 명령 내용을 확인했습니다.')+'</div>':'')+(alternatives.length?'<div class="alternative-commands"><span class="field-label">사용할 수 없을 때 · 조건을 비교하고 하나씩 선택</span><div class="actions">'+alternatives.map(a=>'<button class="btn small" data-command="'+a.id+'">'+E(a.title)+'</button>').join('')+'</div></div>':'')+'<div class="actions spread"><div>'+(c.risk==='custom'?'<button class="btn small" id="edit-command">'+icon('edit')+'수정</button>':'')+'</div><button class="btn primary" id="copy-command">'+icon('copy')+'명령어 복사</button></div>',()=>{
  function preview(){try{const vals={};fields.forEach(n=>vals[n]=$('#param-'+n).value);$('#command-preview').value=fields.length?C.fillCommand(c.command,vals,D.params,c.shell):c.command;setStatus('command-status','개행 없이 선택 값을 인용 처리합니다. 복사 후 대상 경로를 다시 확인하세요.');$('#copy-command').disabled=c.risk!=='read'&&!$('#command-ack').checked;}catch(e){$('#command-preview').value='';setStatus('command-status',e.message,'error');$('#copy-command').disabled=true;}}
  fields.forEach(n=>$('#param-'+n).addEventListener('input',()=>{if($('#command-ack'))$('#command-ack').checked=false;preview();}));if($('#command-ack'))$('#command-ack').onchange=preview;$('#copy-command').onclick=()=>copy($('#command-preview').value);if($('#edit-command'))$('#edit-command').onclick=()=>customCommand(c.id);preview();
 });

  if(existing)$('#custom-delete').onclick=()=>{if(!confirm('이 명령어를 내 보관함에서 삭제할까요?'))return;state.customCommands=state.customCommands.filter(c=>c.id!==id);state.cmdFavs=state.cmdFavs.filter(x=>x!==id);save();$('#modal').close();views.delete('commands');go('commands');toast('내 명령어를 삭제했어요.');};
 });

  q('#regex-run').onclick=async()=>{const thisSeq=++seq;set('regex-output','');status('regex-status','분리된 Worker에서 테스트 중…');try{const r=await regexJob(value('regex-pattern'),value('regex-flags'),value('regex-input'));if(thisSeq!==seq)return;set('regex-output',JSON.stringify(r.rows,null,2));status('regex-status',r.rows.length+'개 매치'+(r.limited?(r.limitReason==='output'?' · 캡처 포함 결과 500,000자 상한에서 중단 (나머지는 미검사)':' · 1,000개 상한에서 중단 (나머지는 미검사)'):'')+' · 인덱스는 UTF-16 코드 유닛 기준','success');counters(root);}catch(e){if(thisSeq!==seq)return;set('regex-output','');status('regex-status',e.message,'error');}};
  q('#regex-sample').onclick=()=>{invalidate();set('regex-input','ERROR connection timeout\nINFO ready\nWARN pool almost full');set('regex-pattern','(ERROR|WARN)\\s+(.+)');set('regex-flags','gm');counters(root);};
 }
 if(id==='settings'){
  let importSeq=0;
  q('#settings-export').onclick=()=>download('pocket-ops-settings.json',JSON.stringify({...state,app:'Pocket Ops',exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');
  q('#settings-import').onchange=async e=>{const seq=++importSeq;try{const f=e.target.files[0];checkFile(f,16*1024*1024);const incoming=validateState(JSON.parse(C.decode(new Uint8Array(await f.arrayBuffer()))));if(seq!==importSeq||!root.isConnected)return;modal('설정을 가져올까요?','<div class="note warn">현재 즐겨찾기·내 명령어·테마를 가져온 설정으로 <b>교체</b>합니다. 로그·변환 입력은 가져오지 않습니다. 가져온 명령어의 안전성은 검증되지 않습니다.</div><p class="muted">도구 '+incoming.toolFavs.length+'개 · 명령어 즐겨찾기 '+incoming.cmdFavs.length+'개 · 내 명령어 '+incoming.customCommands.length+'개</p><button class="btn primary" id="confirm-import">교체하여 가져오기</button>',()=>{$('#confirm-import').onclick=()=>{state=incoming;save();applyTheme();$('#modal').close();views.delete('commands');views.delete('settings');go('settings');toast('설정을 가져왔어요.');};});}catch(e){if(seq===importSeq&&root.isConnected)status('settings-status',e.message,'error');}};
  q('#settings-add-command').onclick=()=>customCommand();q('#clear-inputs').onclick=clearInputs;
  q('#settings-reset').onclick=()=>{if(!confirm('이 앱의 즐겨찾기·내 명령어·테마를 초기화할까요? 다른 사이트 저장소는 건드리지 않습니다.'))return;state={...BASE,toolFavs:[...BASE.toolFavs],cmdFavs:[...BASE.cmdFavs],customCommands:[]};save();applyTheme();views.delete('commands');views.delete('settings');go('settings');toast('앱 설정을 초기화했어요.');};
 }
}
const renderers={home,favorites,commands:commandsPage,encoding:encodingPage,codec:codecPage,json:jsonPage,text:textPage,diff:diffPage,logs:logsPage,sql:sqlPage,unicode:unicodePage,time:timePage,chmod:chmodPage,cron:cronPage,hash:hashPage,regex:regexPage,settings:settingsPage};
function applyTheme(){document.documentElement.dataset.theme=state.theme;const b=$('#theme-toggle');b.innerHTML=icon(state.theme==='dark'?'sun':'moon');b.title=state.theme==='dark'?'밝은 테마로':'어두운 테마로';b.setAttribute('aria-label',b.title);}
function syncStars(){
 $$('[data-tool-star]').forEach(b=>{const active=state.toolFavs.includes(b.dataset.toolStar);b.classList.toggle('starred',active);b.setAttribute('aria-pressed',String(active));});
 $$('[data-cmd-star]').forEach(b=>{const active=state.cmdFavs.includes(b.dataset.cmdStar);b.classList.toggle('starred',active);b.setAttribute('aria-pressed',String(active));});
}
function go(id,updateHash=true){
 if(!Object.prototype.hasOwnProperty.call(renderers,id))id='home';current=id;
 if(['home','favorites','settings'].includes(id))views.delete(id);
 let root=views.get(id),fresh=!root;if(!root){root=document.createElement('section');root.dataset.page=id;root.innerHTML=renderers[id]()+footer();views.set(id,root);}
 $('#view').replaceChildren(root);if(fresh)bindPage(id,root);else if(id==='commands')renderCommands();
 $('#page-crumb').textContent=id==='home'?'내 작업실':id==='favorites'?'즐겨찾기':id==='settings'?'내 포켓 관리':tool(id).title;
 document.title=(id==='home'?'작지만 든든한 내 작업실':$('#page-crumb').textContent)+' · Pocket Ops';
 $$('.nav-btn').forEach(b=>{const active=b.dataset.go===id;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 $('#sidebar').classList.remove('open');$('#mobile-menu').setAttribute('aria-expanded','false');syncStars();counters(root);window.scrollTo(0,0);
 if(updateHash&&location.hash!=='#'+id){try{history.replaceState(null,'','#'+id);}catch(_){location.hash=id;}}
}
function clearInputs(){if(!confirm('열린 모든 도구의 입력·선택한 파일·결과를 비울까요? 즐겨찾기와 저장한 명령어는 유지됩니다.'))return;cleanupTasks.forEach(fn=>fn());cleanupTasks.clear();if($('#modal').open)$('#modal').close();$('#modal').innerHTML='';views.clear();go(current);toast('열린 도구의 입력을 비웠어요. 클립보드와 저장 파일은 그대로입니다.');}
function openPalette(){if($('#modal').open)$('#modal').close();const p=$('#palette');if(!p.open)p.showModal();$('#palette-input').value='';paletteIndex=0;renderPalette();$('#palette-input').focus();}
function renderPalette(){const text=$('#palette-input').value.trim(),ts=D.tools.filter(t=>matches([t.title,t.desc,t.keywords].join(' '),text)).map(t=>({type:'tool',id:t.id,title:t.title,detail:t.desc,icon:t.icon})),cs=allCommands().filter(c=>matches([c.title,c.command,c.tags,c.group].join(' '),text)).map(c=>({type:'command',id:c.id,title:c.title,detail:c.command,icon:'terminal'}));paletteItems=text?ts.concat(cs).slice(0,24):ts.filter(t=>state.toolFavs.includes(t.id)).concat(cs.filter(c=>state.cmdFavs.includes(c.id))).slice(0,12);paletteIndex=0;$('#palette-results').innerHTML=paletteItems.length?paletteItems.map((r,i)=>'<button class="palette-item '+(!i?'selected':'')+'" id="palette-item-'+i+'" role="option" aria-selected="'+(!i)+'" data-palette-index="'+i+'" tabindex="-1">'+icon(r.icon)+'<span><strong>'+E(r.title)+'</strong><small>'+E(r.detail)+'</small></span><span class="tag right">'+(r.type==='tool'?'도구':'명령어')+'</span></button>').join(''):'<div class="empty">다른 단어로 찾아보세요.</div>';$('#palette-input').setAttribute('aria-activedescendant',paletteItems.length?'palette-item-0':'');}
function selectPalette(index){const item=paletteItems[index];if(!item)return;$('#palette').close();if(item.type==='tool')go(item.id);else openCommand(item.id);}
function outputText(id){const el=document.getElementById(id);let text=el.value!==undefined?el.value:el.textContent;if(el.dataset.exactEol==='crlf')text=text.replace(/\r\n?/g,'\n').replace(/\n/g,'\r\n');return text;}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-go],a');if(!b)return;
 if(b.hasAttribute('data-tool-star')){e.stopPropagation();const id=b.dataset.toolStar;state.toolFavs=state.toolFavs.includes(id)?state.toolFavs.filter(x=>x!==id):state.toolFavs.concat(id);save();syncStars();if(current==='favorites')go('favorites');if(current==='home')$('#home-cards').innerHTML=homeCards($('[data-home-domain].active')?.dataset.homeDomain||'');$('[data-tool-star="'+id+'"]')?.focus();return;}
 if(b.hasAttribute('data-cmd-star')){const id=b.dataset.cmdStar;state.cmdFavs=state.cmdFavs.includes(id)?state.cmdFavs.filter(x=>x!==id):state.cmdFavs.concat(id);save();syncStars();if(current==='favorites')go('favorites');if(current==='commands')renderCommands();$('[data-cmd-star="'+id+'"]')?.focus();return;}
 if(b.hasAttribute('data-copy-id')){copy(outputText(b.dataset.copyId));return;}
 if(b.hasAttribute('data-download-id')){download('pocket-'+b.dataset.downloadId+'.txt',outputText(b.dataset.downloadId));return;}
 if(b.hasAttribute('data-clear-id')){const el=document.getElementById(b.dataset.clearId);el.value='';el.dispatchEvent(new Event('input',{bubbles:true}));el.focus();counters();return;}
 if(b.hasAttribute('data-command')){openCommand(b.dataset.command);return;}
 if(b.hasAttribute('data-edit-command')){customCommand(b.dataset.editCommand);return;}
 if(b.hasAttribute('data-command-search')){const search=b.dataset.commandSearch;go('commands');$('#command-query').value=search;$('#command-group').value='';$('#command-permission').value='';$('#command-favorites').checked=false;renderCommands();return;}
 if(b.hasAttribute('data-open-palette')){openPalette();return;}
 if(b.hasAttribute('data-palette-index')){selectPalette(Number(b.dataset.paletteIndex));return;}
 if(b.hasAttribute('data-home-domain')){const domain=b.dataset.homeDomain;$$('[data-home-domain]').forEach(x=>{const active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-pressed',String(active));});$('#home-cards').innerHTML=homeCards(domain);$('#home-domain-guide').innerHTML=domain?'<b>'+E(DOMAINS.find(x=>x[0]===domain)[1])+'</b> 작업에 유용한 도구입니다. <button class="text-btn" data-open-domain="'+domain+'">환경별 명령어 열기 →</button>':'공통 도구로 텍스트·JSON·인코딩을 정리하고, 환경을 선택해 관련 명령어를 찾아보세요.';return;}
 if(b.hasAttribute('data-command-domain')){setCommandDomain(b.dataset.commandDomain);return;}
 if(b.hasAttribute('data-open-domain')){go('commands');$('#command-query').value='';$('#command-permission').value='';$('#command-favorites').checked=false;setCommandDomain(b.dataset.openDomain);return;}
 if(b.hasAttribute('data-go')){const domain=current==='home'&&b.dataset.go==='commands'?$('[data-home-domain].active')?.dataset.homeDomain:'';go(b.dataset.go);if(domain){$('#command-query').value='';$('#command-permission').value='';$('#command-favorites').checked=false;setCommandDomain(domain);}return;}
});
let counterTimer;document.addEventListener('input',e=>{if(e.target.matches('textarea')){clearTimeout(counterTimer);counterTimer=setTimeout(()=>counters(),120);}});
document.addEventListener('keydown',e=>{
 const editable=e.target.matches('input,textarea,select,[contenteditable=true]');
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return;}
 if(e.key==='/'&&!editable&&!$('dialog[open]')){e.preventDefault();openPalette();return;}
 if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('#mobile-menu').setAttribute('aria-expanded','false');}
 if($('#palette').open){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!paletteItems.length)return;paletteIndex=(paletteIndex+(e.key==='ArrowDown'?1:-1)+paletteItems.length)%paletteItems.length;$$('.palette-item').forEach((el,i)=>{el.classList.toggle('selected',i===paletteIndex);el.setAttribute('aria-selected',String(i===paletteIndex));});$('#palette-input').setAttribute('aria-activedescendant','palette-item-'+paletteIndex);$('#palette-item-'+paletteIndex).scrollIntoView({block:'nearest'});}if(e.key==='Enter'){e.preventDefault();selectPalette(paletteIndex);}return;}
 if(!editable&&e.target.classList.contains('tool-card')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click();}
});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==current)go(id,false);});
$('#palette-input').addEventListener('input',renderPalette);
$('#theme-toggle').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';save();applyTheme();};
$('#mobile-menu').onclick=()=>{const open=$('#sidebar').classList.toggle('open');$('#mobile-menu').setAttribute('aria-expanded',String(open));};
$('#clear-all-button').onclick=clearInputs;
$('#release-download').onclick=async()=>{const b=$('#release-download');b.disabled=true;try{if(!window.PocketRelease)throw new Error('배포 파일이 포함되지 않은 빌드입니다.');await window.PocketRelease.download();toast('현재 열린 버전 '+(window.PocketBuild?.version||D.version)+'의 배포 ZIP을 저장합니다.');}catch(e){toast('배포 파일 저장 실패: '+e.message);}finally{b.disabled=false;}};
try{nav();$('#brand-icon').innerHTML=icon('pocket');$('#mobile-menu').innerHTML=icon('menu');$('#top-search-icon').innerHTML=icon('search');$('#clear-all-button').innerHTML=icon('trash');$('#settings-icon').innerHTML=icon('settings');$('#palette-icon').innerHTML=icon('search');applyTheme();refreshStorage();go(location.hash.slice(1)||'home',false);}catch(e){$('#view').innerHTML='<div class="note error">시작하지 못했습니다: '+E(e.message)+'<br>허용된 최신 Chromium 기반 브라우저에서 다시 열어 주세요.</div>';console.error(e);}
})();

</script>
